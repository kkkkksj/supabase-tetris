<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="브라우저에서 즐기는 블록 퍼즐 게임. 줄을 채워 지우고 랭킹에 도전하세요." />
    <meta name="theme-color" content="#0a0c18" />
    <title>Block Drop</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='13' height='13' rx='2' fill='%233ec5e8'/%3E%3Crect x='17' y='2' width='13' height='13' rx='2' fill='%23f5c84c'/%3E%3Crect x='17' y='17' width='13' height='13' rx='2' fill='%23f0566e'/%3E%3Crect x='2' y='17' width='13' height='13' rx='2' fill='%23a77cf0'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1 class="logo">BLOCK<span>DROP</span></h1>
        <div class="top-actions">
          <button id="btn-feedback" class="btn ghost small" type="button">피드백</button>
          <button id="btn-settings" class="icon-btn" type="button" aria-label="사운드 설정" title="사운드 설정">⚙</button>
          <button id="btn-mute" class="icon-btn" type="button" aria-label="음소거" title="음소거 (M)">🔊</button>
        </div>
      </header>

      <main class="layout">
        <section class="game-area" aria-label="게임">
          <aside class="side">
            <div class="panel">
              <h2 class="panel-title">HOLD</h2>
              <canvas id="hold" class="mini" aria-label="보관한 블록"></canvas>
            </div>
            <div class="panel stats">
              <div class="stat"><span>점수</span><strong id="stat-score">0</strong></div>
              <div class="stat"><span>레벨</span><strong id="stat-level">1</strong></div>
              <div class="stat"><span>줄</span><strong id="stat-lines">0</strong></div>
            </div>
            <button id="btn-pause" class="btn ghost small" type="button" disabled>일시정지</button>
          </aside>

          <div class="board-wrap">
            <canvas id="board" class="board" aria-label="게임 보드"></canvas>

            <div id="overlay-start" class="overlay">
              <h2 class="overlay-title">BLOCK DROP</h2>
              <p class="muted">줄을 꽉 채워 지우고 최고 점수에 도전하세요</p>
              <button id="btn-start" class="btn primary" type="button">게임 시작</button>
              <ul class="key-help">
                <li><kbd>←</kbd><kbd>→</kbd> 이동</li>
                <li><kbd>↓</kbd> 빠르게 내리기</li>
                <li><kbd>Space</kbd> 바로 떨어뜨리기</li>
                <li><kbd>↑</kbd>/<kbd>X</kbd> 회전 · <kbd>Z</kbd> 반대 회전</li>
                <li><kbd>C</kbd> 보관 · <kbd>P</kbd> 일시정지 · <kbd>M</kbd> 음소거</li>
              </ul>
            </div>

            <div id="overlay-pause" class="overlay" hidden>
              <h2 class="overlay-title">일시정지</h2>
              <button id="btn-resume" class="btn primary" type="button">계속하기</button>
              <button id="btn-restart" class="btn ghost" type="button">다시 시작</button>
              <button id="btn-pause-settings" class="btn ghost" type="button">사운드 설정</button>
            </div>

            <div id="overlay-gameover" class="overlay" hidden>
              <h2 class="overlay-title">GAME OVER</h2>
              <p class="final-score" id="final-score">0</p>
              <p class="muted" id="final-detail"></p>
              <form id="score-form" class="score-form" novalidate>
                <label for="nickname" class="sr-only">닉네임</label>
                <input id="nickname" name="nickname" type="text" maxlength="12" placeholder="닉네임 (2~12자)" autocomplete="nickname" required />
                <button id="btn-save" class="btn primary" type="submit">점수 저장</button>
              </form>
              <p id="save-msg" class="form-msg" role="status" aria-live="polite"></p>
              <div class="row">
                <button id="btn-again" class="btn ghost" type="button">다시 하기</button>
                <button id="btn-go-feedback" class="btn ghost" type="button">피드백 쓰기</button>
              </div>
            </div>
          </div>

          <aside class="side">
            <div class="panel">
              <h2 class="panel-title">NEXT</h2>
              <canvas id="next" class="mini tall" aria-label="다음 블록"></canvas>
            </div>
          </aside>
        </section>

        <div class="touch-controls" aria-label="터치 조작">
          <button type="button" data-action="hold" aria-label="보관">HOLD</button>
          <button type="button" data-action="ccw" aria-label="반시계 회전">⟲</button>
          <button type="button" data-action="cw" aria-label="시계 회전">⟳</button>
          <button type="button" data-action="pause" aria-label="일시정지">Ⅱ</button>
          <button type="button" data-action="left" aria-label="왼쪽">◀</button>
          <button type="button" data-action="soft" aria-label="빠르게 내리기">▼</button>
          <button type="button" data-action="right" aria-label="오른쪽">▶</button>
          <button type="button" data-action="hard" aria-label="바로 떨어뜨리기">⤓</button>
        </div>

        <section class="panel leaderboard" aria-labelledby="lb-title">
          <div class="panel-head">
            <h2 id="lb-title">랭킹 TOP 20</h2>
            <button id="btn-refresh" class="icon-btn" type="button" aria-label="랭킹 새로고침" title="새로고침">↻</button>
          </div>
          <ol id="leaderboard-list" class="rank-list"></ol>
          <p id="leaderboard-status" class="muted small-text"></p>
        </section>
      </main>
    </div>

    <dialog id="dlg-feedback" class="dialog" aria-labelledby="fb-title">
      <div class="dialog-head">
        <h2 id="fb-title">피드백</h2>
        <button class="icon-btn" type="button" data-close aria-label="닫기">✕</button>
      </div>
      <form id="feedback-form" class="feedback-form" novalidate>
        <label>
          닉네임 <span class="muted">(선택)</span>
          <input id="fb-nickname" type="text" maxlength="12" placeholder="비우면 익명" />
        </label>
        <fieldset class="rating">
          <legend>별점 <span class="muted">(선택)</span></legend>
          <div class="stars" id="fb-stars">
            <button type="button" data-rating="1" aria-label="1점">★</button>
            <button type="button" data-rating="2" aria-label="2점">★</button>
            <button type="button" data-rating="3" aria-label="3점">★</button>
            <button type="button" data-rating="4" aria-label="4점">★</button>
            <button type="button" data-rating="5" aria-label="5점">★</button>
          </div>
        </fieldset>
        <label>
          내용
          <textarea id="fb-message" maxlength="500" rows="4" placeholder="게임에 대한 의견을 자유롭게 남겨 주세요" required></textarea>
        </label>
        <div class="form-foot">
          <span id="fb-count" class="muted small-text">0 / 500</span>
          <button id="btn-fb-submit" class="btn primary small" type="submit">보내기</button>
        </div>
        <p id="fb-msg" class="form-msg" role="status" aria-live="polite"></p>
      </form>
      <h3 class="sub-title">최근 피드백</h3>
      <ul id="feedback-list" class="feedback-list"></ul>
      <p id="feedback-status" class="muted small-text"></p>
    </dialog>

    <dialog id="dlg-settings" class="dialog small" aria-labelledby="st-title">
      <div class="dialog-head">
        <h2 id="st-title">사운드 설정</h2>
        <button class="icon-btn" type="button" data-close aria-label="닫기">✕</button>
      </div>
      <label class="check">
        <input id="set-mute" type="checkbox" />
        음소거
      </label>
      <label>
        배경음 <span id="set-music-val" class="muted">50</span>
        <input id="set-music" type="range" min="0" max="100" step="1" />
      </label>
      <label>
        효과음 <span id="set-sfx-val" class="muted">70</span>
        <input id="set-sfx" type="range" min="0" max="100" step="1" />
      </label>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
